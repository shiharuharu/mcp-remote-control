# Default green path for mcp-remote-control (no live hosts, no Docker matrix).
# Local equivalent: MRC_HOME=tests/fixtures/config ./scripts/harness/ci.sh
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev tools
        run: |
          uv venv --python ${{ matrix.python-version }}
          # smoke_*.sh expects mcp-remote-control-cli on PATH
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff (pinned via dev extra)
        run: uv run ruff check src tests

      - name: Pytest (unit + service + mcp; no integration)
        env:
          MRC_HOME: ${{ github.workspace }}/tests/fixtures/config
        run: |
          uv run pytest -q --ignore=tests/integration -p no:cacheprovider

      - name: CLI offline gates
        env:
          MRC_HOME: ${{ github.workspace }}/tests/fixtures/config
        run: |
          uv run mcp-remote-control-cli doctor
          uv run mcp-remote-control-cli selftest

      - name: Local smoke + MCP surface smoke
        env:
          MRC_HOME: ${{ github.workspace }}/tests/fixtures/config
        run: |
          ./scripts/harness/smoke_local.sh
          ./scripts/harness/smoke_mcp.sh

      - name: Screen fixture replay
        env:
          MRC_HOME: ${{ github.workspace }}/tests/fixtures/config
        run: uv run mcp-remote-control-cli replay --fixture bash_prompt --check

  package:
    name: sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: |
          uv python install 3.12
          uv build

      - name: Assert release hygiene in sdist
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert sdists, "no sdist produced"
          names = tarfile.open(sdists[0]).getnames()
          joined = "\n".join(names)
          assert any(n.endswith("LICENSE") or n.endswith("/LICENSE") for n in names), names[:20]
          assert any("NOTICE" in n for n in names), "NOTICE missing from sdist"
          assert "todo.md" not in joined, "internal todo.md must not ship in sdist"
          assert ".venv" not in joined
          print("sdist hygiene ok:", sdists[0].name, "files=", len(names))
          PY
