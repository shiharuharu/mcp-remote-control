# Default green path for mcp-remote-control (no live hosts, no Docker matrix).
# Local equivalent: MRC_HOME=tests/fixtures/config ./scripts/harness/ci.sh
#
# Action pins target Node.js 24 (checkout@v5+, setup-uv@v7+) to avoid the
# Node 20 deprecation annotations on GitHub-hosted runners.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv + Python ${{ matrix.python-version }}
        # v7+ declares node24; floating major tag is v7 (v9.0.0 exists but no v9 mover yet).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Creates .venv and puts it on PATH for later steps / smoke scripts.
          activate-environment: true

      - name: Install package + dev tools
        run: uv pip install -e ".[dev]"

      # The gate has exactly one definition: scripts/harness/ci.sh (ruff +
      # pytest + doctor/selftest + smokes + replay). Steps must not re-declare
      # gate commands here, or the two copies drift the way they already did
      # when this file ran ruff and the script did not.
      - name: Gate (scripts/harness/ci.sh)
        env:
          MRC_HOME: ${{ github.workspace }}/tests/fixtures/config
        run: ./scripts/harness/ci.sh

  package:
    name: sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv + Python 3.12
        # v7+ declares node24; floating major tag is v7 (v9.0.0 exists but no v9 mover yet).
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Assert release hygiene in sdist
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert sdists, "no sdist produced"
          names = tarfile.open(sdists[0]).getnames()
          joined = "\n".join(names)
          assert any(n.endswith("LICENSE") or n.endswith("/LICENSE") for n in names), names[:20]
          assert any("NOTICE" in n for n in names), "NOTICE missing from sdist"
          assert "todo.md" not in joined, "internal todo.md must not ship in sdist"
          assert ".venv" not in joined
          print("sdist hygiene ok:", sdists[0].name, "files=", len(names))
          PY
